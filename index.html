<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Tech | Login</title>
    <script src="login.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Cyber Tech</h1>
      <p>Welcome to Cyber Tech.</p>
    </header>

    <main>
      <section aria-labelledby="loginHeading">
        <h2 id="loginHeading">Login Account</h2>

        <p>
          Demo login only: any non-empty username and password will continue.
          Do not enter a real password. This page does not verify accounts.
        </p>

        <form id="loginForm">
          <p>
            <label for="username">Username:</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your username"
              autocomplete="username"
              minlength="3"
              maxlength="30"
              required
            >
          </p>

          <p>
            <label for="password">Password:</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter any demo password"
              autocomplete="current-password"
              required
            >
          </p>

          <button type="submit">Login</button>
        </form>

        <p id="loginMessage" role="status" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
